<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Code Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #121316;
      color: #fff;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      background-color: #1a1b1e;
      border-bottom: 1px solid #2c2d30;
    }
    .tab {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #8a8d93;
      cursor: pointer;
      background: none;
      border: none;
      border-right: 1px solid #2c2d30;
    }
    .tab.active {
      color: #fff;
      background-color: #25262b;
      font-weight: 500;
    }

    /* Editor Layout with Line Numbers */
    .editor-wrapper {
      display: flex;
      flex: 1;
      height: 45vh;
      background-color: #1e1f23;
      position: relative;
    }
    .line-numbers {
      width: 40px;
      background-color: #1e1f23;
      color: #5c5f66;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 0;
      text-align: center;
      user-select: none;
    }
    .editor-area {
      flex: 1;
      position: relative;
    }
    textarea {
      width: 100%;
      height: 100%;
      background-color: #1e1f23;
      color: #d4d4d4;
      border: none;
      padding: 10px 10px 10px 0;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      display: none;
      white-space: pre;
    }
    textarea.active {
      display: block;
    }

    /* Control Bar */
    .control-bar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 12px;
      background-color: #141517;
      border-top: 1px solid #2c2d30;
      border-bottom: 1px solid #2c2d30;
    }
    .run-btn {
      background-color: #228be6;
      color: white;
      border: none;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .run-btn:active {
      background-color: #1c7ed6;
    }

    /* Preview Output Area */
    .preview-container {
      flex: 1;
      background-color: #ffffff;
      position: relative;
    }
    .placeholder-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #333;
      font-family: serif;
      font-size: 1.1rem;
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('html')">index.html</button>
    <button class="tab" onclick="switchTab('css')">style.css</button>
    <button class="tab" onclick="switchTab('js')">index.js</button>
  </div>

  <div class="editor-wrapper">
    <div class="line-numbers" id="lineNumbers">1</div>
    <div class="editor-area">
      <textarea id="htmlInput" class="active" placeholder="Enter your HTML code here" oninput="updateLineNumbers()"></textarea>
      <textarea id="cssInput" placeholder="Enter your CSS code here" oninput="updateLineNumbers()"></textarea>
      <textarea id="jsInput" placeholder="Enter your JS code here" oninput="updateLineNumbers()"></textarea>
    </div>
  </div>

  <div class="control-bar">
    <button class="run-btn" onclick="runProject()">&#9654; Run</button>
  </div>

  <div class="preview-container">
    <div class="placeholder-text" id="placeholder">Click on "Run" to run the project</div>
    <iframe id="outputFrame"></iframe>
  </div>

  <script>
    let activeTab = 'html';

    function switchTab(tabName) {
      activeTab = tabName;
      
      // Update Tab Buttons
      document.querySelectorAll('.tab').forEach((tab, idx) => {
        tab.classList.toggle('active', 
          (idx === 0 && tabName === 'html') || 
          (idx === 1 && tabName === 'css') || 
          (idx === 2 && tabName === 'js')
        );
      });

      // Update Active Textarea
      document.getElementById('htmlInput').classList.toggle('active', tabName === 'html');
      document.getElementById('cssInput').classList.toggle('active', tabName === 'css');
      document.getElementById('jsInput').classList.toggle('active', tabName === 'js');

      updateLineNumbers();
    }

    function updateLineNumbers() {
      const activeTextarea = document.querySelector('textarea.active');
      const lines = activeTextarea.value.split('\n').length;
      let lineNumHTML = '';
      for (let i = 1; i <= Math.max(lines, 1); i++) {
        lineNumHTML += i + '<br>';
      }
      document.getElementById('lineNumbers').innerHTML = lineNumHTML;
    }

    function runProject() {
      // Hide placeholder
      document.getElementById('placeholder').style.display = 'none';

      const html = document.getElementById('htmlInput').value;
      const css = document.getElementById('cssInput').value;
      const js = document.getElementById('jsInput').value;

      const combinedCode = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>${js}<\/script>
        </body>
        </html>
      `;

      const iframe = document.getElementById('outputFrame').contentWindow.document;
      iframe.open();
      iframe.write(combinedCode);
      iframe.close();
    }

    // Initialize line numbers
    updateLineNumbers();
  </script>

</body>
  </html>
